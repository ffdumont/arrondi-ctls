<title>Arrondi CTLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --papier:   #EDF1F5;
  --encre:    #16212C;
  --encre-2:  #4A5D6E;
  --regle:    #C4D0DB;
  --panneau:  #F7F9FB;
  --herbe:    #7F8D64;
  --herbe-2:  #6E7C55;
  --ciel-h:   #CFDFEC;
  --ciel-b:   #E7EEF4;
  --trace:    #D9480F;
  --magenta:  #D6236F;
  --marque:   #FFFFFF;
  --ombre:    rgba(22, 33, 44, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier:   #0D161E;
    --encre:    #E4EDF4;
    --encre-2:  #8FA3B4;
    --regle:    #223140;
    --panneau:  #121D27;
    --herbe:    #3B4832;
    --herbe-2:  #47543B;
    --ciel-h:   #16222E;
    --ciel-b:   #1B2A38;
    --trace:    #F97316;
    --magenta:  #F0509A;
    --marque:   #F2F6FA;
    --ombre:    rgba(0, 0, 0, .38);
  }
}
:root[data-theme="dark"] {
  --papier: #0D161E; --encre: #E4EDF4; --encre-2: #8FA3B4; --regle: #223140;
  --panneau: #121D27; --herbe: #3B4832; --herbe-2: #47543B; --ciel-h: #16222E;
  --ciel-b: #1B2A38; --trace: #F97316; --magenta: #F0509A; --marque: #F2F6FA;
  --ombre: rgba(0, 0, 0, .38);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--papier); color: var(--encre);
  font-family: Barlow, system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 56px; }

/* --- en-tete ------------------------------------------------------------- */
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
         border-bottom: 1px solid var(--regle); padding-bottom: 12px; }
h1 { font-family: "Barlow Semi Condensed", Barlow, sans-serif; font-weight: 700;
     font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -.01em;
     margin: 0; text-wrap: balance; }
.sous { color: var(--encre-2); font-size: .95rem; }
.ruban { font-family: "IBM Plex Mono", monospace; font-size: .72rem;
         letter-spacing: .1em; text-transform: uppercase; color: var(--encre-2); }

/* --- scene --------------------------------------------------------------- */
.scene { position: relative; margin-top: 16px; border: 1px solid var(--regle);
         border-radius: 3px; overflow: hidden; background: var(--ciel-b);
         box-shadow: 0 1px 0 var(--ombre); }
#vue { display: block; width: 100%; height: clamp(260px, 42vh, 420px); }
.hud { position: absolute; top: 10px; left: 12px; display: grid;
       grid-template-columns: auto auto; gap: 1px 14px;
       background: color-mix(in srgb, var(--panneau) 88%, transparent);
       border: 1px solid var(--regle); border-radius: 2px; padding: 8px 12px;
       font-family: "IBM Plex Mono", monospace; font-size: .78rem;
       font-variant-numeric: tabular-nums; }
.hud dt { color: var(--encre-2); }
.hud dd { margin: 0; text-align: right; font-weight: 500; }

/* --- transport ----------------------------------------------------------- */
.transport { display: flex; align-items: center; gap: 12px; margin-top: 12px;
             flex-wrap: wrap; }
button, .vitesse button { font: inherit; font-family: "Barlow Semi Condensed", sans-serif;
  font-weight: 600; letter-spacing: .02em; color: var(--encre);
  background: var(--panneau); border: 1px solid var(--regle); border-radius: 2px;
  padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--encre-2); }
button[aria-pressed="true"] { background: var(--encre); color: var(--panneau);
                              border-color: var(--encre); }
:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
.vitesse { display: flex; gap: 4px; }
.piste-temps { flex: 1 1 220px; min-width: 180px; }
input[type=range] { width: 100%; accent-color: var(--trace); }
.horloge { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
           font-size: .82rem; color: var(--encre-2); }

/* --- bandes de mesure ---------------------------------------------------- */
.bandes { margin-top: 18px; display: grid; gap: 10px; }
.bande { border: 1px solid var(--regle); border-radius: 3px; background: var(--panneau); }
.bande h2 { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600;
            font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
            color: var(--encre-2); margin: 0; padding: 7px 12px 0; }
.bande canvas { display: block; width: 100%; height: 104px; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px;
           font-size: .82rem; color: var(--encre-2); }
.legende span { display: inline-flex; align-items: center; gap: 7px; }
.pastille { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
code { font-family: "IBM Plex Mono", monospace; font-size: .86em; }
</style>

<main>
  <header>
    <h1>Arrondi CTLS</h1>
    <p class="sous" id="sous"></p>
    <p class="ruban" id="ruban"></p>
  </header>

  <div class="scene">
    <canvas id="vue"></canvas>
    <dl class="hud">
      <dt>hauteur</dt><dd><span id="v_h"></span> m</dd>
      <dt>vitesse</dt><dd><span id="v_ias"></span> kt</dd>
      <dt>variomètre</dt><dd><span id="v_vz"></span> ft/min</dd>
      <dt>assiette</dt><dd><span id="v_theta"></span>°</dd>
      <dt>incidence</dt><dd><span id="v_alpha"></span>°</dd>
      <dt>au seuil</dt><dd><span id="v_x"></span> m</dd>
    </dl>
  </div>

  <div class="transport">
    <button id="play" aria-pressed="false">Lecture</button>
    <div class="vitesse" role="group" aria-label="vitesse de lecture">
      <button data-v="0.5">×½</button>
      <button data-v="1" aria-pressed="true">×1</button>
      <button data-v="2">×2</button>
    </div>
    <div class="piste-temps">
      <input type="range" id="curseur" min="0" max="1000" value="0" step="1"
             aria-label="instant du vol">
    </div>
    <div class="horloge"><span id="v_t"></span> / <span id="v_tot"></span> s</div>
  </div>

  <section class="bandes" id="bandes"></section>

  <div class="legende">
    <span><i class="pastille" style="background:var(--trace)"></i>trajectoire volée</span>
    <span><i class="pastille" style="background:var(--encre-2)"></i>plan de descente commandé</span>
    <span><i class="pastille" style="background:var(--marque);outline:1px solid var(--encre-2)"></i>point d'aboutissement</span>
    <span><i class="pastille" style="background:var(--magenta)"></i>marque de toucher peinte</span>
  </div>

</main>

const N = D.t.length;
const M = D.marques, V = D.vol;

/* ---------------------------------------------------------------- le fil de fer
   LA SILHOUETTE EST MESUREE, PAS DESSINEE : c'est la projection du modele visuel de
   X-Plane sur son plan de symetrie (tools/xplane_shape.py). Origine au contact de la
   roue principale -- c'est autour de lui que l'avion pivote a l'arrondi, et c'est lui
   qui touche le sol -- nez vers les x croissants, assiette nulle. */
const SIL = D.silhouette;

const vue = document.getElementById('vue');
const ctx = vue.getContext('2d');
/* `horloge` est la SECONDE DE VOL montree, et non un numero d'image. Une premiere
   version avancait d'une image de trace par image d'ecran : a 60 Hz d'affichage pour
   10,6 Hz de trace, la scene defilait 5,7 fois trop vite et le "x1" ne valait pas le
   temps reel. */
let idx = 0, horloge = 0, joue = false, vitesse = 1, dernier = 0;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lerp = (a, b, u) => a + (b - a) * u;

function dimensionne(c) {
  const r = window.devicePixelRatio || 1, b = c.getBoundingClientRect();
  c.width = Math.round(b.width * r); c.height = Math.round(b.height * r);
  const g = c.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0);
  return [b.width, b.height];
}

/* ------------------------------------------------------------------ la scene */
function dessineScene() {
  const [L, H] = dimensionne(vue);
  const x = D.x[idx], h = D.hw[idx], th = D.theta[idx];

  /* ZOOM ADAPTATIF, ET LE SOL TOUJOURS VISIBLE. La hauteur de fenetre suit la hauteur
     de l'avion, bornee : loin on voit le plan, pres on voit le geste. Le sol est
     ancre aux quatre cinquiemes de l'image, donc il ne sort jamais du cadre. */
  const fenetre = Math.min(62, Math.max(13, h * 2.4 + 8));
  const ech = (H * 0.80) / fenetre;                 // pixels par metre
  const y0 = H * 0.80;                              // ligne de sol, en pixels
  const cx = L * 0.42;                              // l'avion se tient a 42 % a gauche
  const px = (wx) => cx + (wx - x) * ech;
  const py = (wy) => y0 - wy * ech;

  const ciel = ctx.createLinearGradient(0, 0, 0, y0);
  ciel.addColorStop(0, css('--ciel-h')); ciel.addColorStop(1, css('--ciel-b'));
  ctx.fillStyle = ciel; ctx.fillRect(0, 0, L, y0);
  ctx.fillStyle = css('--herbe'); ctx.fillRect(0, y0, L, H - y0);

  /* la piste : une bande d'herbe tondue, du seuil a 900 m */
  ctx.fillStyle = css('--herbe-2');
  ctx.fillRect(px(0), y0, Math.max(1, px(900) - px(0)), Math.min(10, (H - y0)));

  /* graduations tous les 100 m */
  ctx.font = '500 11px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let d = -500; d <= 900; d += 100) {
    const X = px(d);
    if (X < -40 || X > L + 40) continue;
    ctx.strokeStyle = css('--regle'); ctx.globalAlpha = .8; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y0 + 7); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = css('--encre-2');
    if (d % 200 === 0) ctx.fillText(d > 0 ? '+' + d : String(d), X, y0 + 9);
  }

  /* seuil, aboutissement, marque de toucher */
  const barre = (X, couleur, largeur) => {
    ctx.fillStyle = couleur;
    ctx.fillRect(X - largeur / 2, y0 - 1, largeur, 5);
  };
  ctx.strokeStyle = css('--encre'); ctx.lineWidth = 2; ctx.globalAlpha = .55;
  ctx.beginPath(); ctx.moveTo(px(0), y0 - 12); ctx.lineTo(px(0), y0 + 4); ctx.stroke();
  ctx.globalAlpha = 1;
  barre(px(M.aboutissement), css('--marque'), 12);
  ctx.strokeStyle = css('--encre-2'); ctx.lineWidth = 1;
  ctx.strokeRect(px(M.aboutissement) - 6, y0 - 1, 12, 5);
  barre(px(M.toucher_peint), css('--magenta'), 12);

  /* le plan de descente commande : droite qui passe par le seuil a la TCH */
  ctx.strokeStyle = css('--encre-2'); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.2;
  ctx.globalAlpha = .75; ctx.beginPath();
  const pente = Math.tan(V.pente * Math.PI / 180);
  ctx.moveTo(px(-500), py(V.tch_m + 500 * pente));
  ctx.lineTo(px(M.aboutissement), py(0));
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  /* la trajectoire : passe pleine, avenir en pointille */
  ctx.lineWidth = 1.6; ctx.strokeStyle = css('--trace');
  ctx.beginPath();
  for (let k = 0; k <= idx; k++) {
    const X = px(D.x[k]), Y = py(D.hw[k]);
    k === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
  }
  ctx.stroke();
  ctx.globalAlpha = .28; ctx.setLineDash([4, 4]); ctx.beginPath();
  for (let k = idx; k < N; k++) {
    const X = px(D.x[k]), Y = py(D.hw[k]);
    k === idx ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  dessineAvion(px(x), py(h), th, ech);
}

/* TAILLE PLANCHER DU FIL DE FER, en pixels par metre. A 35 m de hauteur la fenetre fait
   90 m et l'echelle tombe a ~3 px/m : l'avion ferait 17 px de long et son assiette ne se
   lirait plus -- or c'est ce que la page existe pour montrer. En dessous de ce plancher
   il est donc dessine plus grand que l'echelle du decor ; des l'arrondi, la fenetre
   retrecit, l'echelle repasse au-dessus et il redevient a l'echelle exacte. */
const PX_PAR_M_MIN = 9.5;

function dessineAvion(X, Y, theta, ech) {
  const t = Math.max(PX_PAR_M_MIN, ech);
  ctx.save();
  ctx.translate(X, Y);
  ctx.rotate(-theta * Math.PI / 180);      // assiette a cabrer = nez vers le haut
  ctx.scale(t, -t);                        // repere avion : y vers le haut
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const chemin = (pts) => {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const [a, b] = pts[i];
      i ? ctx.lineTo(a, b) : ctx.moveTo(a, b);
    }
    ctx.closePath();
  };
  /* Le contour plein d'abord, en aplat tres leger : il detache l'avion du ciel sans
     rien cacher du decor. Les creux -- la verriere -- sont ensuite retraces par-dessus. */
  SIL.contours.forEach(c => {
    chemin(c.points);
    if (!c.creux) {
      ctx.fillStyle = css('--panneau'); ctx.globalAlpha = .55; ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = css('--encre');
    ctx.lineWidth = (c.creux ? 1.1 : 1.7) / t;
    ctx.globalAlpha = c.creux ? .65 : 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}

/* ------------------------------------------------------------ bandes de mesure */
const BANDES = [
  {cle: 'hw',    titre: 'hauteur des roues (m)',              fmt: v => v.toFixed(1)},
  {cle: 'vz',    titre: 'variomètre (ft/min, + = monte)',     fmt: v => v.toFixed(0),
   zero: true},
  {cle: 'ias',   titre: 'vitesse indiquée (kt)',              fmt: v => v.toFixed(1),
   seuil: V.avertisseur},
  {cle: 'theta', titre: 'assiette et incidence (deg)',        fmt: v => v.toFixed(1),
   second: 'alpha', zero: true},
  {cle: 'elev',  titre: 'commande de profondeur',             fmt: v => v.toFixed(2),
   zero: true}
];

const bandes = document.getElementById('bandes');
BANDES.forEach(b => {
  const d = document.createElement('div');
  d.className = 'bande';
  d.innerHTML = '<h2>' + b.titre + '</h2>';
  const c = document.createElement('canvas');
  c.dataset.cle = b.cle;
  d.appendChild(c); bandes.appendChild(d);
  b.canvas = c;
  const vise = (ev) => {
    const r = c.getBoundingClientRect();
    const u = Math.min(1, Math.max(0, (ev.clientX - r.left - 46) / (r.width - 58)));
    const cible = D.x[0] + u * (D.x[N - 1] - D.x[0]);
    let meilleur = 0;
    for (let k = 1; k < N; k++)
      if (Math.abs(D.x[k] - cible) < Math.abs(D.x[meilleur] - cible)) meilleur = k;
    pose(meilleur);
  };
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); vise(e); });
  c.addEventListener('pointermove', e => { if (e.buttons) vise(e); });
});

function dessineBande(b) {
  const [L, H] = dimensionne(b.canvas);
  const g = b.canvas.getContext('2d');
  const gauche = 46, droite = 12, haut = 10, bas = 16;
  const serie = D[b.cle], second = b.second ? D[b.second] : null;
  let lo = Math.min(...serie), hi = Math.max(...serie);
  if (second) { lo = Math.min(lo, ...second); hi = Math.max(hi, ...second); }
  if (b.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const marge = (hi - lo) * 0.12 || 1;
  lo -= marge; hi += marge;
  const px = k => gauche + (D.x[k] - D.x[0]) / (D.x[N - 1] - D.x[0]) * (L - gauche - droite);
  const py = v => haut + (hi - v) / (hi - lo) * (H - haut - bas);

  g.clearRect(0, 0, L, H);
  /* reperes verticaux : seuil, aboutissement, marque de toucher */
  const repere = (xm, couleur, alpha) => {
    const k = D.x.findIndex(v => v >= xm);
    if (k < 0) return;
    g.strokeStyle = couleur; g.globalAlpha = alpha; g.lineWidth = 1;
    g.beginPath(); g.moveTo(px(k), haut); g.lineTo(px(k), H - bas); g.stroke();
    g.globalAlpha = 1;
  };
  repere(0, css('--encre'), .35);
  repere(M.aboutissement, css('--encre-2'), .55);
  repere(M.toucher_peint, css('--magenta'), .6);

  if (b.zero && lo < 0 && hi > 0) {
    g.strokeStyle = css('--regle'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(gauche, py(0)); g.lineTo(L - droite, py(0)); g.stroke();
  }
  if (b.seuil) {
    g.strokeStyle = css('--encre-2'); g.setLineDash([3, 3]); g.globalAlpha = .8;
    g.beginPath(); g.moveTo(gauche, py(b.seuil)); g.lineTo(L - droite, py(b.seuil));
    g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }

  const courbe = (s, couleur, largeur, alpha) => {
    g.strokeStyle = couleur; g.lineWidth = largeur; g.globalAlpha = alpha;
    g.beginPath();
    for (let k = 0; k < N; k++) k ? g.lineTo(px(k), py(s[k])) : g.moveTo(px(k), py(s[k]));
    g.stroke(); g.globalAlpha = 1;
  };
  if (second) courbe(second, css('--encre-2'), 1.2, .85);
  courbe(serie, css('--trace'), 1.6, 1);

  /* graduations : deux valeurs, celles que la courbe atteint vraiment */
  g.font = '500 10px "IBM Plex Mono", monospace';
  g.fillStyle = css('--encre-2'); g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillText(b.fmt(hi - marge), gauche - 6, py(hi - marge));
  g.fillText(b.fmt(lo + marge), gauche - 6, py(lo + marge));

  /* le curseur, a l'instant montre dans la scene */
  g.strokeStyle = css('--encre'); g.globalAlpha = .55; g.lineWidth = 1;
  g.beginPath(); g.moveTo(px(idx), haut); g.lineTo(px(idx), H - bas); g.stroke();
  g.globalAlpha = 1;
  g.fillStyle = css('--trace');
  g.beginPath(); g.arc(px(idx), py(serie[idx]), 3, 0, Math.PI * 2); g.fill();
}

/* ------------------------------------------------------------------ pilotage */
const el = id => document.getElementById(id);
const curseur = el('curseur');

function pose(k) {
  idx = Math.max(0, Math.min(N - 1, k));
  horloge = D.t[idx];
  curseur.value = String(Math.round(idx / (N - 1) * 1000));
  el('v_h').textContent = D.hw[idx].toFixed(1);
  el('v_ias').textContent = D.ias[idx].toFixed(1);
  el('v_vz').textContent = (D.vz[idx] > 0 ? '+' : '') + D.vz[idx].toFixed(0);
  el('v_theta').textContent = (D.theta[idx] > 0 ? '+' : '') + D.theta[idx].toFixed(1);
  el('v_alpha').textContent = D.alpha[idx].toFixed(1);
  el('v_x').textContent = (D.x[idx] > 0 ? '+' : '') + D.x[idx].toFixed(0);
  el('v_t').textContent = D.t[idx].toFixed(1);
  dessine();
}

function dessine() {
  dessineScene();
  BANDES.forEach(dessineBande);
}

function boucle(ts) {
  if (joue) {
    // Le `min` borne le saut apres un onglet mis en veille : au retour, on reprend la
    // lecture au lieu de sauter a la fin.
    horloge += Math.min(0.25, (ts - dernier) / 1000) * vitesse;
    dernier = ts;
    if (horloge >= D.t[N - 1]) { pose(N - 1); bascule(false); }
    else {
      let k = idx;
      while (k < N - 1 && D.t[k + 1] <= horloge) k++;
      const h = horloge;                 // `pose` recale l'horloge sur l'image posee
      pose(k); horloge = h;
    }
  }
  requestAnimationFrame(boucle);
}

function bascule(v) {
  joue = v; dernier = performance.now();
  const b = el('play');
  b.textContent = v ? 'Pause' : 'Lecture';
  b.setAttribute('aria-pressed', String(v));
}

el('play').addEventListener('click', () => {
  if (!joue && idx >= N - 1) pose(0);
  bascule(!joue);
});
document.querySelectorAll('.vitesse button').forEach(b => {
  b.addEventListener('click', () => {
    vitesse = parseFloat(b.dataset.v);
    document.querySelectorAll('.vitesse button').forEach(
      o => o.setAttribute('aria-pressed', String(o === b)));
  });
});
curseur.addEventListener('input', () => {
  bascule(false);
  pose(Math.round(curseur.value / 1000 * (N - 1)));
});
window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); bascule(!joue); }
  if (e.key === 'ArrowRight') { bascule(false); pose(idx + 1); }
  if (e.key === 'ArrowLeft') { bascule(false); pose(idx - 1); }
});
window.addEventListener('resize', dessine);

/* --------------------------------------------------------------- l'ouverture */
el('v_tot').textContent = V.duree.toFixed(1);
el('sous').textContent =
  `${V.piste} · volets ${V.volets}° · ${V.vref} kt · plan ${V.pente}° · ${V.masse} kg`;
el('ruban').textContent = [`essai ${D.uid}`, V.verdict, V.note ? V.note + '/100' : null]
  .filter(Boolean).join(' · ');
/* ETAT AU REPOS : la page s'ouvre sur l'arrondi, pas sur une image vide -- c'est le
   moment qu'elle existe pour montrer. La lecture, elle, part du debut de la finale. */
const iArrondi = D.x.findIndex(v => v >= M.aboutissement);
pose(iArrondi > 0 ? iArrondi : 0);
requestAnimationFrame(boucle);
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setTimeout(() => { pose(0); bascule(true); }, 900);
}
</script>
